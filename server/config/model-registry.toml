schema_version = 1

# 密钥写入model-secrets.toml，主力可选择下列任意远端条目。
[runtime]
backend = "openai_compatible"
active_profile = "light"

[gateway]
request_timeout_seconds = 120
max_retries = 1
retry_backoff_seconds = 0.5
max_output_tokens = 20480
response_format = "json_object"

[profiles]
light = "deepseek_flash"
strong = "qwen_flash"
decision = "startlux_local"

[routing]
strong_enabled = false

[routing.task_profiles]
conversation_reply = "light"
reflection = "light"
reflection_diagnosis = "light"
character_interview_review = "strong"

[decision]
enabled = false
profile = "decision"
timeout_seconds = 30
input_max_chars = 32000

[decision.controls]
think_mode = "never"

[entries.deepseek_flash]
model_vendor = "deepseek"
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
credential_ref = "deepseek"
access_route = "deepseek-direct"
extra_body = { thinking = { type = "disabled" } }

[entries.qwen_flash]
model_vendor = "dashscope"
model = "qwen3.8-flash"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
credential_ref = "dashscope"
access_route = "dashscope-direct"
extra_body = { enable_thinking = false }

[entries.minimax_flash]
model_vendor = "minimax"
model = "MiniMax-M3.1-Flash"
base_url = "https://api.minimax.cn/v1"
credential_ref = "minimax"
access_route = "minimax-direct"
extra_body = { reasoning_split = true, reasoning_effort = "low" }

[entries.startlux_local]
protocol = "startlux_decision"
model_vendor = "startlux"
model = "StartLux-Decision-v1.1-0.8B-Instant"
base_url = "http://127.0.0.1:8090"
access_route = "local-startlux"
max_output_tokens = 64
context_window_tokens = 8192
token_counter = "hf:startlux-models/StartLux-Decision-v1.1-0.8B-Instant"
request_timeout_seconds = 30
