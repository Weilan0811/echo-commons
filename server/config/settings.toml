schema_version = 1

[activity]
input_max_chars = 32000
persona_direct_max_chars = 6000
persona_projection_max_chars = 4000
event_limit = 100
private_thought_limit = 5

[game_analysis.rapfi]
directory = "../data/game-analysis/rapfi/250615"
# 留空时按当前系统选择固定发布包中的 SSE 或 Apple Silicon 程序。
threads = 1
hash_memory_mb = 64
search_time_ms = 500
candidates = 6
timeout_seconds = 10

# 相对路径以本文件所在的 server/config/ 为起点。

[server]
cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
environment = "development"
host = "127.0.0.1"
port = 8765

[storage]
database_path = "../data/echo-commons.sqlite3"
asset_directory = "../data/assets/images"

[images]
base_url = "https://api.apimart.ai/v1"
model = "gpt-image-2"
credential_ref = "apimart"
concurrency = 1
poll_interval_seconds = 5
request_timeout_seconds = 30
task_timeout_seconds = 900

[identity]

[workers]
enabled = true
poll_interval_seconds = 0.25
shutdown_timeout_seconds = 30
model_concurrency = 3

[task]
lease_seconds = 90.0
lease_heartbeat_interval_seconds = 5.0
lease_safety_margin_seconds = 2.0
max_agent_attempts = 3
retry_backoff_seconds = 1.0

[social]
quiet_window_seconds = 6
max_chain_messages = 3
max_chain_tasks = 6

[conversation]
max_thought_length = 1000
max_utterance_length = 2000

[context]
recent_message_limit = 20
recent_message_max_chars = 6000
covered_message_overlap = 4
resident_memory_limit = 32
memory_search_max_results = 5

[conversation.generation]
# 不填写时使用 model-registry.toml 中选定模型的值；该文件也未填写时使用供应商默认值。
# temperature = 0.7
# top_p = 0.9
# max_output_tokens = 512

[reflection]
# 记忆查询、行动生成和格式修正都计入同一节点的有限预算。
max_model_steps = 4
max_model_requests = 4
execution_timeout_seconds = 300
max_materials = 256
max_material_chars = 20000
max_messages_per_segment = 100
max_candidates = 64
max_output_chars = 20000
initialization_max_candidates = 256
initialization_max_output_chars = 160000
initialization_chars_per_input_char = 6
initialization_candidates_per_material = 8
core_memory_max_chars = 600
relationship_attitude_max_chars = 300

[reflection.diagnosis]
facts_enabled = false
summaries_enabled = false
max_revisions = 2

[reflection.generation]
# temperature = 0.7
# top_p = 0.9
# max_output_tokens = 512

[model]
registry_path = "model-registry.toml"
secrets_path = "model-secrets.toml"

[observability]
log_level = "INFO"
log_path = "../data/logs/echo.log"
log_max_bytes = 5242880
log_backup_count = 3
debug_capture_enabled = false
debug_capture_path = "../data/debug-captures"
trace_retry_backoff_seconds = 1.0
trace_max_attempts = 5
trace_lease_seconds = 30.0
trace_batch_size = 25
