[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "echo-commons-server"
version = "0.1.0"
description = "Authoritative multi-agent gameplay platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.115,<1.0",
    "jieba>=0.42.1,<1.0",
    "openai>=1.0,<3.0",
    "pydantic>=2.10,<3.0",
    "PyYAML>=6.0,<7.0",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
echo-commons = "echo_commons.app.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "httpx2>=2.13,<3.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/echo_commons"]

[tool.uv]
default-groups = ["dev"]
link-mode = "copy"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "model: test that calls the configured real model provider",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
