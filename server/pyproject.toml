[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "echo-commons-server"
version = "0.1.0"
description = "Authoritative multi-agent gameplay platform."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "echo-games",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1",
    "jieba>=0.42.1,<1.0",
    "numpy>=2.0,<3.0",
    "openai>=1.0,<3.0",
    "pillow>=11,<13",
    "pydantic>=2.10,<3.0",
    "python-multipart>=0.0.20,<1",
    "PyYAML>=6.0,<7.0",
    "sse-starlette>=3.5.0",
    "tiktoken>=0.12,<1",
    "tzdata>=2026.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
echo-commons = "echo_commons.app.cli:main"

[dependency-groups]
dev = [
    "py7zr>=1,<2",
    "httpx>=0.28,<1.0",
    "httpx-sse>=0.4.3",
    "httpx2>=2.13,<3.0",
    "markdown-it-py>=4,<5",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/echo_commons"]

[tool.uv]
default-groups = ["dev"]
link-mode = "copy"

[tool.uv.sources]
echo-games = { path = "../games", editable = true }

[tool.pytest.ini_options]
addopts = "-q -m 'not model'"
pythonpath = ["tests"]
testpaths = ["tests"]
markers = [
    "model: test that calls the configured real model provider",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
